name: Build Windows desktop app
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-desktop.yml', 'test/desktop-window-state.test.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-desktop-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned build dependencies
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Check saved window states
        working-directory: desktop
        run: npm test
      - name: Confirm the native executable packaging metadata
        working-directory: desktop
        run: |
          node -e "const fs=require('node:fs');for(const name of ['app-builder-lib/out/appInfo.js','app-builder-lib/out/targets/nsis/NsisTarget.js']){const s=fs.readFileSync(require.resolve(name),'utf8');for(const line of s.split('\n'))if(/productFilename\s*=|executableName|APP_EXECUTABLE_FILENAME|APP_FILENAME:/.test(line))console.log(name+': '+line.trim())}"
      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Verify native WebView2, immediate window display and saved states
        run: ./desktop/native-smoke-test.ps1
      - name: Verify the family logo in the installer and app
        run: ./desktop/check-installer-branding.ps1
      - name: Verify real installation, installed app and desktop shortcut
        run: ./desktop/install-smoke-test.ps1
      - name: Check the smaller payload
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $bytes = (Get-Item "desktop/dist/Keha-Family-Setup-$version.exe").Length
          if ($bytes -gt 15MB) { throw 'The installer exceeds the lightweight size budget.' }
          Write-Host "Windows installer size: $bytes bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: keha-family-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish the installer download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $installer = "desktop/dist/Keha-Family-Setup-$version.exe"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Keha Family for Windows $version" --notes-file desktop/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'The Windows installer could not be published.' }
