name: Validate Worker build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'public/index.html'
      - 'test/**'
      - 'package*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/validate-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check family site behavior
        run: npm run check
      - name: Bundle without publishing
        run: npx wrangler deploy --dry-run --outdir /tmp/keha-worker-build
