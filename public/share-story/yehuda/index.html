<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183e4b">
  <meta name="robots" content="noindex,nofollow">
  <title>סיפורים על זהור ודוד יהודה | משפחת נקאש (יהודה)</title>
  <meta name="description" content="משתפים סיפורים וזיכרונות על זהור ודוד יהודה. כותבים שם וסיפור ושולחים.">
  <meta property="og:title" content="זיכרונות על זהור ודוד יהודה">
  <meta property="og:description" content="סיפור קטן, זיכרון גדול. כותבים שם וסיפור ושולחים.">
  <link rel="stylesheet" href="/share-story/form.css">
  <link rel="stylesheet" href="/share-story/people.css">
  <script src="/share-story/form.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="family">משפחת נקאש (יהודה)</p>
      <h1>זיכרונות מזהור<br>ומדוד יהודה</h1>
      <p class="intro">סיפור מצחיק, רגע מרגש או זיכרון קטן.<br>נשמח לשמור אותם יחד.</p>
    </header>
    <form id="story-form" data-scope="yehuda">
      <label for="name">שם פרטי ושם משפחה</label>
      <input id="name" name="name" autocomplete="name" maxlength="100" required enterkeyhint="next" placeholder="איך קוראים לך?">
      <fieldset>
        <legend>על מי הסיפור? אפשר לסמן כמה</legend>
        <div class="people">
          <label><input type="checkbox" name="person" value="zehor"><span>זהור</span></label>
          <label><input type="checkbox" name="person" value="yehuda"><span>דוד יהודה</span></label>
        </div>
      </fieldset>
      <label for="story">הסיפור שלך</label>
      <textarea id="story" name="story" rows="8" maxlength="50000" required dir="auto" placeholder="אפשר להתחיל ב״אני זוכר/ת ש…״"></textarea>
      <div class="trap" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <p id="error" role="alert" hidden></p>
      <button id="send" type="submit">שלח</button>
      <p class="note">הסיפור יישלח במייל.</p>
    </form>
    <section id="success" tabindex="-1" hidden aria-labelledby="thanks">
      <div class="check" aria-hidden="true">✓</div>
      <h2 id="thanks">תודה על הסיפור!</h2>
      <p>הסיפור נשלח בהצלחה.<br>כל זיכרון הוא חלק מהסיפור של המשפחה.</p>
      <button id="another" type="button">שליחת סיפור נוסף</button>
    </section>
    <noscript><p>כדי לשלוח סיפור יש להפעיל JavaScript בדפדפן.</p></noscript>
  </main>
</body>
</html>
